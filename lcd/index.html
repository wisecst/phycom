<script type="application/json" id="deviceConceptData">{"name":"LCD","type":"출력장치","page":178,"concept":"LCD(액정 표시 장치)는 전기 신호를 이용해 문자나 숫자 등의 정보를 화면에 표시하는 출력 장치입니다.","subtitle":"개념","paragraphs":["<mark data-key=\"1\">LCD(Liquid Crystal Display, 액정 표시 장치)</mark>를 사용하면 원하는 자료를 쉽게 출력할 수 있다. 피지컬 컴퓨팅 실습용으로 가장 많이 사용하는 LCD는 <mark data-key=\"2\">16*2 Character LCD</mark>로서 <mark data-key=\"2\">1줄</mark>에 <mark data-key=\"2\">16개</mark>의 <mark data-key=\"2\">문자</mark>씩 총 <mark data-key=\"2\">2줄 32개 문자</mark>를 표기할 수 있다. 사용하기 위해서는 매우 <mark data-key=\"3\">많은 핀</mark>을 연결해야 하므로 <mark data-key=\"3\">회로 구성</mark>이 어렵다는 단점이 있다. 이를 개선하기 위해 <mark data-key=\"4\">I2C 컨버터 모듈</mark>을 기존의 16*2 Character LCD에 결합하여 사용하면 <mark data-key=\"4\">4개</mark>의 <mark data-key=\"4\">배선</mark>만으로 사용할 수 있어 회로 구성이 매우 쉬워진다. <mark data-key=\"5\">I2C 인터페이스</mark>를 사용하여 LCD를 제어하기 때문에 <mark data-key=\"5\">SDA, SCL 핀</mark>은 반드시 해당 기능을 지원하는 <mark data-key=\"5\">A4, A5 핀</mark>에 연결해야 한다."],"notes":["LCD(액정 표시 장치)는 전기 신호를 이용해 문자나 숫자 등의 정보를 화면에 표시하는 출력 장치입니다.","한 줄에 16개씩 두 줄, 총 32개 문자를 표시합니다.","많은 핀을 연결하면 회로 구성이 어려워집니다.","I2C 컨버터 모듈을 결합하면 4개의 배선을 사용합니다.","교과서는 SDA를 A4, SCL을 A5에 연결하도록 설명합니다.","오렌지보드 연결 방법\nSDA → 디지털 핀 영역 최상단 SDA\nSCL → 디지털 핀 영역 최상단 SCL"],"noteDisplay":[false,false,false,false,false,false],"noteHighlights":[[],[],[],[],[],["디지털 핀 영역 최상단 SDA","디지털 핀 영역 최상단 SCL"]],"supplements":[null,null,null,null,{"title":"I2C(I2C, Inter-Intergrated Circuit, 아이스퀘어드시)","design":"plain","side":"right","paragraphs":["필립스에서 개발한 통신 방식이다. 칩셋과 제어 칩셋 간 사운드 데이터를 전송하기 위한 통신용으로 사용하는 통신 규격이다.","현재는 IC 간 통신으로 많이 쓰이며, 여러 장비를 연결할 수 있다는 장점 때문에 센서류에 많이 활용한다."],"highlights":[],"links":["I2C 인터페이스"]}]}</script>
